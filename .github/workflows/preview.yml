name: Publish approved PR preview

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  build:
    # Approval is deliberately tied to this exact same-repository candidate.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.number == 14 &&
      github.event.pull_request.user.login == 'selfish' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha == 'eb34cc11e28aba93d4bba286f2b79b090f4d820e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
          PUBLIC_URL: /pr-preview/pr-14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    steps:
      # Only trusted base-branch automation executes in this write-enabled job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
      - name: Validate and stage only the approved preview directory
        env:
          PREVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 automation/scripts/pages_preview.py candidate pages 14 "$PREVIEW_HEAD"
      - name: Publish without rewriting branch history
        working-directory: pages
        env:
          PREVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          current_head=$(git ls-remote origin refs/pull/14/head | cut -f1)
          test "$current_head" = "$PREVIEW_HEAD"
          if ! git diff --cached --quiet; then
            git -c user.name=selfish -c user.email=7327741+selfish@users.noreply.github.com commit -m "Publish approved preview for PR 14"
            git push origin HEAD:gh-pages
          fi
          echo 'Preview candidate: https://codenames.nit.ai/pr-preview/pr-14/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication must be verified over HTTPS before reporting the preview as live.' >> "$GITHUB_STEP_SUMMARY"

  verify-live:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install isolated browser test dependency
        run: python3 -m pip install --target "$RUNNER_TEMP/preview-browser" playwright==1.56.0
      - name: Verify public desktop and mobile preview
        env:
          PYTHONPATH: ${{ runner.temp }}/preview-browser
        run: python3 scripts/check_preview.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview-evidence.json
            preview-desktop.png
            preview-mobile.png
          if-no-files-found: error
          retention-days: 7
