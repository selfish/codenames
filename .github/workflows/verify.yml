name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview publication safety tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Multiplayer authority tests
        run: npm run test:server

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Install isolated browser tools
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/online-browser" playwright==1.56.0
          # Reuse the runner browser, as the existing hosted-preview checks do.
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            PYTHONPATH="$RUNNER_TEMP/online-browser" python3 -m playwright install --with-deps chromium
          fi

      - name: Four-phone multiplayer browser checks
        env:
          PYTHONPATH: ${{ runner.temp }}/online-browser
        run: |
          node scripts/export_worker.mjs build "$RUNNER_TEMP/remzilo-worker"
          node scripts/preview_worker.mjs "$RUNNER_TEMP/remzilo-worker/index.mjs" "$RUNNER_TEMP/remzilo-worker/preview.sqlite" > "$RUNNER_TEMP/online-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/ > /dev/null; then break; fi
            sleep 1
          done
          GAME_URL=http://127.0.0.1:3002 python3 scripts/check_cards.py
          GAME_URL=http://127.0.0.1:3002 python3 scripts/check_online.py
